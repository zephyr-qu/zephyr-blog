<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="500" height="370" rx="10" fill="#ffffff"/>
  <rect x="10" y="10" width="500" height="370" rx="10" fill="none" stroke="#e2e8f0"/>

  <!-- 节点 A:开始 -->
  <rect x="210" y="30" width="100" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="260" y="58" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">开始</text>

  <!-- 节点 B:继续?(菱形) -->
  <polygon points="260,125 315,160 260,195 205,160" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="260" y="165" font-family="sans-serif" font-size="13" fill="#78350f" text-anchor="middle">继续?</text>

  <!-- 节点 C:处理 -->
  <rect x="360" y="250" width="100" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="277" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">处理</text>

  <!-- 节点 D:结束 -->
  <rect x="60" y="250" width="100" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="110" y="277" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">结束</text>

  <!-- A -> B -->
  <line x1="260" y1="74" x2="260" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B -> C (Yes) -->
  <path d="M315,160 L410,160 L410,246" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="152" font-family="sans-serif" font-size="12" fill="#64748b">Yes</text>

  <!-- B -> D (No) -->
  <path d="M205,160 L110,160 L110,246" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="145" y="152" font-family="sans-serif" font-size="12" fill="#64748b">No</text>

  <!-- C -> B (返回) -->
  <path d="M360,272 L300,272 L300,199" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="318" y="290" font-family="sans-serif" font-size="12" fill="#64748b">返回</text>
</svg>
